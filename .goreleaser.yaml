version: 2

project_name: nr

before:
  hooks:
    - go mod tidy

builds:
  - id: nr
    main: ./cmd/nr
    binary: nr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/noderings/cli/internal/cli.version={{.Version}}
      - -X github.com/noderings/cli/internal/cli.commit={{.Commit}}
      - -X github.com/noderings/cli/internal/cli.buildDate={{.Date}}

archives:
  - id: nr
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

sboms:
  - artifacts: archive

release:
  github:
    owner: noderings
    name: cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"
