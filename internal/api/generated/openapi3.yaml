          title: |-
            Plan fields to update (name, description, and trial_days come from
            template, not updatable)
        planPrices:
          type: array
          items:
            $ref: "#/components/schemas/v1PlanPriceOverride"
          title: >-
            Plan prices with overrides (unit_amount_minor, currency, free_units
            per

            metric)
        addonPriceOverrides:
          type: array
          items:
            $ref: "#/components/schemas/v1AddonPriceOverride"
          title: "Optional: Override prices for addons when updating plan"
        regionId:
          type: string
          description: Region for this plan offer (optional on update).
        cpuLimit:
          type: integer
          format: int32
          description: >-
            Plan CPU/network scheduling overrides written into
            metadata.specifications.

