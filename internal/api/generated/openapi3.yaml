          $ref: "#/components/schemas/v1Distro"
        createTime:
          type: string
          format: date-time
          description: The creation timestamp of the virtual machine.
          readOnly: true
        updateTime:
          type: string
          format: date-time
          description: The last update timestamp of the virtual machine.
          readOnly: true
        regionCountry:
          type: string
          description: The country of the region where the virtual machine is located.
          readOnly: true
        regionCity:
          type: string
          description: The city of the region where the virtual machine is located.
          readOnly: true
        providerName:
          type: string
          description: The name of the provider organization that owns the node where the
            virtual machine is located.
          readOnly: true
        tags:
          type: array
          items:
            type: string
          title: Tags for categorizing the virtual machine (e.g., "database", "webserver")
        firewallRulesetId:
          type: string
          description: >-
            Firewall ruleset attached to this VM (contains both ingress and
            egress rules).

            Managed via attach/detach firewall endpoints.
          readOnly: true
        addonSubscriptions:
          type: array
          items:
            $ref: "#/components/schemas/v1AddonSubscription"
          title: Active addon subscriptions for this VM (backup, etc.)
          readOnly: true
        hasActiveBackupSubscription:
          type: boolean
          description: True when this VM has an active backup-class addon subscription
            (derived from subscription add-ons).
          readOnly: true
        activeBackupSubscriptionName:
          type: string
          description: Display name of the active backup addon (empty when
            has_active_backup_subscription is false).
          readOnly: true
        planBillingType:
          $ref: "#/components/schemas/v1BillingType"
        additionalIpv4:
          type: array
          items:
            $ref: "#/components/schemas/v1AdditionalIPAddress"
          description: Extra IPv4 addresses purchased via the ADDITIONAL-IP addon (same
            prefix as primary).
          readOnly: true
        bandwidthEgress:
          $ref: "#/components/schemas/v1VirtualMachineBandwidthQuota"
        bandwidthIngress:
          $ref: "#/components/schemas/v1VirtualMachineBandwidthQuota"
        reinstallStatus:
          $ref: "#/components/schemas/v1ReinstallStatus"
        reinstalledAt:
          type: string
          format: date-time
          readOnly: true
        instantAppId:
          type: string
          description: Platform Instant App used when this VM was created/reinstalled
            (empty when OS-only).
          readOnly: true
        instantAppSlug:
          type: string
          readOnly: true
        instantAppName:
          type: string
          readOnly: true
        instantAppVersion:
          type: string
          readOnly: true
        instantAppFamily:
          type: string
          description: Family key used for icons under /icons/instant-apps/{family}.svg
            (e.g. portainer).
          readOnly: true
        instantAppIconUrl:
          type: string
          description: Optional override; when empty, clients fall back to the family icon
            path.
          readOnly: true
        planCode:
          type: string
          description: Marketplace plan code for this VM's subscription (e.g.
            "DC-CPU-4C-4G-160").
          readOnly: true
      description: VirtualMachine represents a managed virtual machine resource.
    v1VirtualMachineBandwidthQuota:
      type: object
      properties:
        usedGb:
          type: number
          format: double
          description: Total bandwidth used this billing period (decimal GB, 1000^3 bytes).
          readOnly: true
        freeUnitsGb:
          type: integer
          format: int32
          description: Included free bandwidth per period (GB). Zero when unlimited or not
            configured.
          readOnly: true
        blockSizeGb:
          type: integer
          format: int32
          description: Overage block size (GB). Zero when unlimited or linear pricing.
          readOnly: true
        blockPrice:
          type: string
          description: Price per overage block (decimal string, e.g. "2.00").
          readOnly: true
        currency:
          type: string
          readOnly: true
        unlimited:
          type: boolean
          description: True when bandwidth is effectively unlimited ($0 overage) for this
            direction.
          readOnly: true
        periodStart:
          type: string
          format: date-time
          readOnly: true
        periodEnd:
          type: string
          format: date-time
          readOnly: true
        overageGb:
          type: number
          format: double
          description: GB above the free allowance (0 when within free tier).
          readOnly: true
        billableBlocks:
          type: integer
          format: int32
          description: Whole overage blocks currently billable (ceil(overage_gb /
            block_size_gb)).
          readOnly: true
        nextBlockGb:
          type: number
          format: double
          description: Total usage GB at which the next overage block would begin (0 when
            unlimited).
          readOnly: true
        estimatedOverageAmount:
          type: string
          description: Estimated overage charge for the current period (decimal string).
          readOnly: true
        billingEnabled:
          type: boolean
          description: False when usage is shown for visibility only (e.g. ingress not
            billed on this plan).
          readOnly: true
      description: >-
        VirtualMachineBandwidthQuota summarizes plan bandwidth allowance and
        metered usage for graphs/billing UX.

        Shared by both bandwidth_egress and bandwidth_ingress on VirtualMachine.
    v1VirtualMachineSmtpOutboundPolicyView:
      type: object
      properties:
        virtualMachineId:
          type: string
        hostname:
          type: string
        action:
          $ref: "#/components/schemas/v1SmtpOutboundVmAction"
        effectiveBlocked:
          type: boolean
        clientOrganizationId:
          type: string
          description: Client organization that owns the VM (grouping key for provider UI).
        clientOwnerUserId:
          type: string
          description: First owner user of that client organization (when resolved).
        clientContactEmail:
          type: string
          description: Contact email of that owner (when resolved).
        ipv4:
          type: string
          description: Primary active IPv4 / IPv6 from IPAM allocations (empty when none).
        ipv6:
          type: string
    v1VoteRoadmapFeatureRequestResponse:
      type: object
      properties:
        request:
          $ref: "#/components/schemas/v1RoadmapFeatureRequest"
