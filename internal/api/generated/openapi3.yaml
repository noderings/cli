        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: isTemplate
          description: |-
            Filter to show only template plans (true) or only non-template plans
            (false) If not specified, shows both template and non-template plans
          in: query
          required: false
          schema:
            type: boolean
        - name: endUser
          description: >-
            Filter by end user type (client, provider, or all)

            If not specified, shows plans for all end user types based on organization

            permissions
          in: query
          required: false
          schema:
            type: string
            enum:
              - END_USER_UNSPECIFIED
              - END_USER_CLIENT
              - END_USER_PROVIDER
              - END_USER_ALL
              - END_USER_USER
            default: END_USER_UNSPECIFIED
        - name: search
          description: Search filter for plan name, code, or description
          in: query
          required: false
          schema:
            type: string
        - name: assetType
          description: Filter by asset type (vm, gameserver, etc.)
          in: query
          required: false
          schema:
            type: string
            enum:
              - ASSET_TYPE_UNSPECIFIED
              - ASSET_TYPE_VM
              - ASSET_TYPE_CONTAINER
              - ASSET_TYPE_STORAGE
              - ASSET_TYPE_GAMESERVER
              - ASSET_TYPE_CDN
              - ASSET_TYPE_IP_ADDRESS
              - ASSET_TYPE_DNS
              - ASSET_TYPE_GPU
              - ASSET_TYPE_GENERIC
            default: ASSET_TYPE_UNSPECIFIED
        - name: billingType
          description: >-
            Filter by billing type (subscription, usage, etc.)

            If not specified, shows plans for all billing types

             - BILLING_TYPE_PERCENTAGE: Percentage-based pricing (e.g., 30% of parent plan)
          in: query
          required: false
          schema:
            type: string
            enum:
              - BILLING_TYPE_UNSPECIFIED
              - BILLING_TYPE_SUBSCRIPTION
              - BILLING_TYPE_USAGE
              - BILLING_TYPE_FREE
              - BILLING_TYPE_PERCENTAGE
            default: BILLING_TYPE_UNSPECIFIED
        - name: filterComputeType
          description: >-
            Filter by compute type (optional). If provided, only plans with
            matching compute type in their name are returned.

            Examples: "high performance", "high frequency", "general compute", "general purpose", "cpu optimized", "memory optimized", "storage optimized"

            Filtering is case-insensitive.
          in: query
          required: false
          schema:
            type: string
        - name: filterCode
          description: >-
            Filter by plan code (optional). If provided, only plans with
            matching code are returned.

            Filtering is case-insensitive.

            Examples: "SC-GC-1C-1G-20", "DC-HF-4C-8G-160"

            Filtering is case-insensitive.
          in: query
          required: false
          schema:
            type: string
