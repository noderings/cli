paths:
  "/api/v1/webhooks/{provider}":
    post:
      summary: >-
        Handle webhook events from payment providers (Stripe, PayPal, etc.)

        This endpoint receives webhook payloads and processes payment/subscription

        events Note: The actual implementation will read raw HTTP body and headers

        directly to support webhook signature verification
      operationId: WebhookService_HandleWebhook
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1HandleWebhookResponse"
      parameters:
        - name: provider
          description: |-
            Payment provider identifier (e.g., "stripe", "paypal")
            Validated in implementation to ensure supported providers
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookServiceHandleWebhookBody"
        required: true
      tags:
        - WebhookService
  "/v1/addon-subscriptions/{addonSubscriptionId}":
    delete:
      summary: Remove an addon from a subscription
      operationId: AddonService_RemoveAddon
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1RemoveAddonResponse"
      parameters:
        - name: addonSubscriptionId
          in: path
          required: true
          schema:
            type: string
        - name: cancelImmediately
          description: If false, cancels at period end
          in: query
          required: false
          schema:
            type: boolean
      tags:
        - AddonService
  /v1/addons:
    get:
      summary: List available addons
      operationId: AddonService_ListAddons
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1ListAddonsResponse"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: subscriptionId
          description: Filter by compatible with subscription
          in: query
          required: false
          schema:
            type: string
        - name: addonType
          description: Filter by type
          in: query
          required: false
          schema:
            type: string
            enum:
              - ADDON_TYPE_UNSPECIFIED
              - ADDON_TYPE_BACKUP
              - ADDON_TYPE_SNAPSHOT
              - ADDON_TYPE_ADDITIONAL_IP
            default: ADDON_TYPE_UNSPECIFIED
        - name: isTemplate
          description: Filter by template status
          in: query
          required: false
          schema:
            type: boolean
        - name: billingType
          description: >-
            Filter by billing type (usage-based or fixed/subscription)

             - BILLING_TYPE_PERCENTAGE: Percentage-based pricing (e.g., 30% of parent plan)
          in: query
          required: false
          schema:
            type: string
            enum:
              - BILLING_TYPE_UNSPECIFIED
              - BILLING_TYPE_SUBSCRIPTION
              - BILLING_TYPE_USAGE
              - BILLING_TYPE_FREE
              - BILLING_TYPE_PERCENTAGE
            default: BILLING_TYPE_UNSPECIFIED
        - name: search
          description: Search filter for addon name, code, or description
          in: query
          required: false
          schema:
            type: string
      tags:
        - AddonService
    post:
      summary: Create an addon from a template addon
      operationId: AddonService_CreateAddon
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1SuccessResponse"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1CreateAddonRequest"
        required: true
      tags:
        - AddonService
  "/v1/addons/{id}":
