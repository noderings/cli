        timestamps:
          $ref: "#/components/schemas/v1Timestamps"
    v1FirewallAddressGroupInput:
      type: object
      properties:
        name:
          type: string
        prefixes:
          type: array
          items:
            $ref: "#/components/schemas/v1FirewallIPPrefix"
          description: |-
            CIDR prefixes. Can contain mixed IPv4 and IPv6 addresses.
            Supports "all IPs" via 0.0.0.0/0 or ::/0.
      description: >-
        FirewallAddressGroupInput is the client-provided payload for
        create/update.

        Clients must not provide id/timestamps (those are server-controlled).
    v1FirewallDirection:
      type: string
      enum:
        - FIREWALL_DIRECTION_UNSPECIFIED
        - FIREWALL_DIRECTION_INGRESS
        - FIREWALL_DIRECTION_EGRESS
      default: FIREWALL_DIRECTION_UNSPECIFIED
    v1FirewallIPPrefix:
      type: object
      properties:
        ip:
          type: string
          description: IPv4 or IPv6 address. May be "0.0.0.0" (v4 default route) or "::"
            (v6 default route).
        prefix:
          type: integer
          format: int64
          description: "Prefix length. IPv4: 0-32. IPv6: 0-128. Enforced by backend based
            on derived family."
      description: >-
        FirewallIPPrefix represents a single CIDR prefix as separate fields.

        The backend will normalize/store it as a CIDR string (e.g., "10.0.0.0/24", "0.0.0.0/0", "::/0").
    v1FirewallProtocol:
      type: string
      enum:
        - FIREWALL_PROTOCOL_UNSPECIFIED
        - FIREWALL_PROTOCOL_TCP
        - FIREWALL_PROTOCOL_UDP
        - FIREWALL_PROTOCOL_SCTP
        - FIREWALL_PROTOCOL_IPV6
        - FIREWALL_PROTOCOL_ICMP
        - FIREWALL_PROTOCOL_ICMPV6
        - FIREWALL_PROTOCOL_ESP
        - FIREWALL_PROTOCOL_AH
        - FIREWALL_PROTOCOL_IPSEC
        - FIREWALL_PROTOCOL_GRE
        - FIREWALL_PROTOCOL_IPIP
        - FIREWALL_PROTOCOL_VXLAN
        - FIREWALL_PROTOCOL_L2TP
        - FIREWALL_PROTOCOL_GENEVE
        - FIREWALL_PROTOCOL_ANY
        - FIREWALL_PROTOCOL_IGMP
        - FIREWALL_PROTOCOL_GGP
        - FIREWALL_PROTOCOL_IPENCAP
        - FIREWALL_PROTOCOL_ST
        - FIREWALL_PROTOCOL_EGP
        - FIREWALL_PROTOCOL_IGP
        - FIREWALL_PROTOCOL_PUP
        - FIREWALL_PROTOCOL_HMP
        - FIREWALL_PROTOCOL_XNS_IDP
        - FIREWALL_PROTOCOL_RDP
        - FIREWALL_PROTOCOL_ISO_TP4
        - FIREWALL_PROTOCOL_DCCP
        - FIREWALL_PROTOCOL_XTP
        - FIREWALL_PROTOCOL_DDP
        - FIREWALL_PROTOCOL_IDPR_CMTP
        - FIREWALL_PROTOCOL_IPV6_ROUTE
        - FIREWALL_PROTOCOL_IPV6_FRAG
        - FIREWALL_PROTOCOL_IDRP
        - FIREWALL_PROTOCOL_RSVP
        - FIREWALL_PROTOCOL_SKIP
        - FIREWALL_PROTOCOL_IPV6_ICMP
        - FIREWALL_PROTOCOL_IPV6_NONXT
        - FIREWALL_PROTOCOL_IPV6_OPTS
        - FIREWALL_PROTOCOL_VMTP
        - FIREWALL_PROTOCOL_EIGRP
        - FIREWALL_PROTOCOL_OSPF
        - FIREWALL_PROTOCOL_AX_25
        - FIREWALL_PROTOCOL_ETHERIP
        - FIREWALL_PROTOCOL_ENCAP
        - FIREWALL_PROTOCOL_PIM
        - FIREWALL_PROTOCOL_IPCOMP
        - FIREWALL_PROTOCOL_VRRP
        - FIREWALL_PROTOCOL_ISIS
        - FIREWALL_PROTOCOL_FC
        - FIREWALL_PROTOCOL_MOBILITY_HEADER
        - FIREWALL_PROTOCOL_UDPLITE
        - FIREWALL_PROTOCOL_MPLS_IN_IP
        - FIREWALL_PROTOCOL_HIP
        - FIREWALL_PROTOCOL_SHIM6
        - FIREWALL_PROTOCOL_WESP
        - FIREWALL_PROTOCOL_ROHC
      default: FIREWALL_PROTOCOL_UNSPECIFIED
      title: >-
        - FIREWALL_PROTOCOL_ICMPV6: legacy alias; prefer IPV6_ICMP for new rules
         - FIREWALL_PROTOCOL_IPSEC: legacy logical grouping; not a Proxmox /etc/protocols name
         - FIREWALL_PROTOCOL_VXLAN: legacy; not in Proxmox protocol selector
         - FIREWALL_PROTOCOL_GENEVE: legacy; not in Proxmox protocol selector
         - FIREWALL_PROTOCOL_ANY: Match all protocols (Proxmox proto left unset)
         - FIREWALL_PROTOCOL_IGMP: Remaining values mirror Proxmox VE IPProtocolSelector (www/manager6/form/IPProtocolSelector.js)
         - FIREWALL_PROTOCOL_XNS_IDP: xns-idp
         - FIREWALL_PROTOCOL_ISO_TP4: iso-tp4
         - FIREWALL_PROTOCOL_IDPR_CMTP: idpr-cmtp
         - FIREWALL_PROTOCOL_IPV6_ROUTE: ipv6-route
         - FIREWALL_PROTOCOL_IPV6_FRAG: ipv6-frag
         - FIREWALL_PROTOCOL_IPV6_ICMP: ipv6-icmp (Proxmox name for ICMPv6)
         - FIREWALL_PROTOCOL_IPV6_NONXT: ipv6-nonxt
         - FIREWALL_PROTOCOL_IPV6_OPTS: ipv6-opts
         - FIREWALL_PROTOCOL_AX_25: ax.25
         - FIREWALL_PROTOCOL_MOBILITY_HEADER: mobility-header
         - FIREWALL_PROTOCOL_MPLS_IN_IP: mpls-in-ip
