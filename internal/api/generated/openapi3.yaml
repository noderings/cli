security:
  - BearerAuth: []
    OrgIDHeader: []
components:
  requestBodies:
    v1ChatRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/v1ChatRequest"
      required: true
  securitySchemes:
    BearerAuth:
      type: apiKey
      description: Bearer token
      name: Authorization
      in: header
    OrgIDHeader:
      type: apiKey
      description: Tenant or organization identifier
      name: X-Organization-ID
      in: header
  schemas:
    AddonServiceAddAddonToSubscriptionBody:
      type: object
      properties:
        addonId:
          type: string
        addonPriceId:
          type: string
        quantity:
          type: integer
          format: int32
    AddonServiceUpdateAddonBody:
      type: object
      properties:
        currency:
          type: string
          title: Currency for the addon price (optional, must be 3 characters if provided)
        unitAmount:
          type: string
          description: Decimal string with 6 decimal places precision
          title: Override unit_amount_minor for the addon price (optional)
        percentageValue:
          type: number
          format: double
          title: >-
            Override percentage value for percentage-based pricing formula
            (optional,

            0-100)
        zeroBaseFallbackAmount:
          type: string
          description: Decimal string with 6 decimal places precision
          title: >-
            Optional: Fixed amount to use when base plan price is zero (for free
            plans)

            Only used for percentage-based pricing formulas when parent_plan.base_price

            is 0
    AgentServiceGenerateInstallCommandBody:
      type: object
    AgentServiceGeneratePeeringConfigBody:
      type: object
    AgentServiceUpdateAgentBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    AgentServiceUploadInboundPeeringConfigBody:
      type: object
      properties:
        kubeconfig:
          type: string
          description: Provider-generated peering-user kubeconfig YAML for neo as consumer.
    BackupServiceRestoreBackupBody:
      type: object
      properties:
        startAfterRestore:
          type: boolean
    ClientProviderReviewServiceUpdateClientReviewBody:
      type: object
      properties:
        starRating:
          type: integer
          format: int32
        comment:
          type: string
    CloudInitTemplateServiceUpdateCloudInitTemplateBody:
      type: object
      properties:
        name:
          type: string
        userData:
          type: string
        vendorData:
          type: string
        networkData:
          type: string
        storage:
          type: string
    CloudInitUserDataServiceUpdateCloudInitUserDataBody:
      type: object
      properties:
        name:
          type: string
        userData:
          type: string
        description:
          type: string
    EnvironmentVariableServiceUpdateEnvironmentVariableBody:
      type: object
      properties:
        value:
          type: string
    FirewallServiceCreateFirewallRuleBody:
      type: object
      properties:
        rule:
          $ref: "#/components/schemas/v1FirewallRuleInput"
    FirewallServiceMoveFirewallRuleBody:
      type: object
      properties:
        targetRuleId:
          type: string
          title: ID of the target rule to move relative to
        position:
          $ref: "#/components/schemas/v1FirewallRulePosition"
      description: >-
        MoveFirewallRuleRequest is used to reorder firewall rules via
        drag-and-drop.

        The rule specified by `id` will be moved to a position relative to `target_rule_id`.

        Rules can only be moved within the same direction (ingress/egress).
    FirewallServiceUpdateFirewallAddressGroupBody:
      type: object
      properties:
        group:
          $ref: "#/components/schemas/v1FirewallAddressGroupInput"
    FirewallServiceUpdateFirewallRuleBody:
      type: object
      properties:
        rule:
          $ref: "#/components/schemas/v1FirewallRuleInput"
    FirewallServiceUpdateFirewallRuleSetBody:
      type: object
      properties:
        ruleset:
          $ref: "#/components/schemas/v1FirewallRuleSetInput"
    GroupServiceUpdateGroupBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        groupRoles:
          type: array
          items:
            type: string
    IPAMServiceAddReservedIPBody:
      type: object
      properties:
        ipAddress:
          type: string
          title: Must be within prefix CIDR
      title: IP Reservation
    IPAMServiceAddReservedPrefixBody:
      type: object
      properties:
        cidr:
          type: string
          title: Must match prefix vm_assignment_prefix_length exactly
    IPAMServiceAssignNetworkToNodeBody:
      type: object
      properties:
        nodeIds:
          type: array
          items:
            type: string
          title: One or more node IDs to assign to this network
      title: Node-Network assignment
    IPAMServiceClearAllPrefixReservedIPsBody:
      type: object
    IPAMServiceReserveAllPrefixIPsBody:
      type: object
    IPAMServiceUpdateNetworkBody:
      type: object
      properties:
        dnsServers:
          type: array
          items:
            type: string
        name:
          type: string
        description:
          type: string
        macAddressPrefix:
          type: string
          description: First 3 octets for MAC allocation within this network. Empty =
            leave unchanged on update.
    IPAMServiceUpdatePrefixBody:
      type: object
      properties:
        networkId:
