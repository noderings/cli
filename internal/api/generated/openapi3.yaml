            type: string
        - name: filterCity
          description: Filter by city name (case-insensitive)
          in: query
          required: false
          schema:
            type: string
        - name: filterBillingType
          description: >-
            Filter by billing type

             - BILLING_TYPE_PERCENTAGE: Percentage-based pricing (e.g., 30% of parent plan)
          in: query
          required: false
          schema:
            type: string
            enum:
              - BILLING_TYPE_UNSPECIFIED
              - BILLING_TYPE_SUBSCRIPTION
              - BILLING_TYPE_USAGE
              - BILLING_TYPE_FREE
              - BILLING_TYPE_PERCENTAGE
            default: BILLING_TYPE_UNSPECIFIED
        - name: filterComputeType
          description: >-
            Filter by compute type

             - COMPUTE_TYPE_GENERAL_COMPUTE: GC - General Compute (balanced performance)
             - COMPUTE_TYPE_HIGH_FREQUENCY: HF - High Frequency (CPU-optimized, high clock speeds)
             - COMPUTE_TYPE_HIGH_PERFORMANCE: HP - High Performance (next-gen CPUs, NVMe storage)
             - COMPUTE_TYPE_GENERAL_PURPOSE: GP - General Purpose (balanced dedicated resources)
             - COMPUTE_TYPE_CPU_OPTIMIZED: CPU - CPU Optimized (high CPU-to-memory ratio)
             - COMPUTE_TYPE_MEMORY_OPTIMIZED: MEM - Memory Optimized (high memory-to-CPU ratio)
             - COMPUTE_TYPE_STORAGE_OPTIMIZED: STO - Storage Optimized (high storage capacity)
             - COMPUTE_TYPE_VERY_HIGH_FREQUENCY: VHF - Very High Frequency (highest clock dedicated CPUs)
             - COMPUTE_TYPE_GAME_SERVER: GS - Game Server (per-CPU SKU dedicated plans, e.g. DC-GS-9950X-*)
          in: query
          required: false
          schema:
            type: string
            enum:
              - COMPUTE_TYPE_UNSPECIFIED
              - COMPUTE_TYPE_GENERAL_COMPUTE
              - COMPUTE_TYPE_HIGH_FREQUENCY
              - COMPUTE_TYPE_HIGH_PERFORMANCE
              - COMPUTE_TYPE_GENERAL_PURPOSE
              - COMPUTE_TYPE_CPU_OPTIMIZED
              - COMPUTE_TYPE_MEMORY_OPTIMIZED
              - COMPUTE_TYPE_STORAGE_OPTIMIZED
              - COMPUTE_TYPE_VERY_HIGH_FREQUENCY
              - COMPUTE_TYPE_GAME_SERVER
            default: COMPUTE_TYPE_UNSPECIFIED
        - name: filterComputeCategory
          description: >-
            Filter by compute category

             - COMPUTE_CATEGORY_SHARED_COMPUTE: Shared compute (shared resources, cost-effective)
             - COMPUTE_CATEGORY_DEDICATED_COMPUTE: Dedicated compute (dedicated resources, higher performance)
          in: query
          required: false
          schema:
            type: string
            enum:
              - COMPUTE_CATEGORY_UNSPECIFIED
              - COMPUTE_CATEGORY_SHARED_COMPUTE
              - COMPUTE_CATEGORY_DEDICATED_COMPUTE
            default: COMPUTE_CATEGORY_UNSPECIFIED
      tags:
        - MarketplaceService
