          type: integer
          format: int64
          description: Position of the rule (0, 1, 2, 3...). Sequential position
            indicating order. Auto-assigned by the system.
          readOnly: true
        timestamps:
          $ref: "#/components/schemas/v1Timestamps"
      description: FirewallRuleResource is a first-class rule resource that belongs to
        a FirewallRuleSet.
    v1FirewallRuleSet:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        timestamps:
          $ref: "#/components/schemas/v1Timestamps"
        ruleCount:
          type: integer
          format: int32
          description: Number of rules in this ruleset (ingress and egress combined).
          readOnly: true
        attachedVmCount:
          type: integer
          format: int32
          description: Number of virtual machines currently attached to this ruleset.
          readOnly: true
        attachedVmHostnames:
          type: array
          items:
            type: string
          description: Hostnames of virtual machines attached to this ruleset (sorted).
          readOnly: true
    v1FirewallRuleSetAttachmentFilter:
      type: string
      enum:
        - FIREWALL_RULESET_ATTACHMENT_FILTER_UNSPECIFIED
        - FIREWALL_RULESET_ATTACHMENT_FILTER_ATTACHED
        - FIREWALL_RULESET_ATTACHMENT_FILTER_UNATTACHED
      default: FIREWALL_RULESET_ATTACHMENT_FILTER_UNSPECIFIED
      description: >-
        FirewallRuleSetAttachmentFilter filters rulesets by whether any VM is
        attached.

         - FIREWALL_RULESET_ATTACHMENT_FILTER_UNSPECIFIED: All rulesets
         - FIREWALL_RULESET_ATTACHMENT_FILTER_ATTACHED: Rulesets with at least one VM attached
         - FIREWALL_RULESET_ATTACHMENT_FILTER_UNATTACHED: Rulesets with no VMs attached
    v1FirewallRuleSetInput:
      type: object
      properties:
        name:
          type: string
