        Clients must not provide id/ruleset_id/timestamps (those are server-controlled).
    v1FirewallRulePosition:
      type: string
      enum:
        - FIREWALL_RULE_POSITION_UNSPECIFIED
        - FIREWALL_RULE_POSITION_BEFORE
        - FIREWALL_RULE_POSITION_AFTER
      default: FIREWALL_RULE_POSITION_UNSPECIFIED
      title: >-
        - FIREWALL_RULE_POSITION_BEFORE: Move before the target rule (higher
        priority)
         - FIREWALL_RULE_POSITION_AFTER: Move after the target rule (lower priority)
