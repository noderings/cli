        - name: filterCountry
          description: Filter by country name (required, case-insensitive)
          in: query
          required: false
          schema:
            type: string
        - name: filterCity
          description: Filter by city name (required, case-insensitive)
          in: query
          required: false
          schema:
            type: string
        - name: filterBillingType
          description: >-
            Filter by billing type (subscription/fixed or usage-based)

             - BILLING_TYPE_PERCENTAGE: Percentage-based pricing (e.g., 30% of parent plan)
          in: query
          required: false
          schema:
            type: string
            enum:
              - BILLING_TYPE_UNSPECIFIED
              - BILLING_TYPE_SUBSCRIPTION
              - BILLING_TYPE_USAGE
              - BILLING_TYPE_FREE
              - BILLING_TYPE_PERCENTAGE
            default: BILLING_TYPE_UNSPECIFIED
        - name: search
          description: Search by organization name or description
          in: query
          required: false
          schema:
            type: string
        - name: filterIpv6AvailableOnly
          in: query
          required: false
          schema:
            type: boolean
        - name: planPriceSort
          description: >-
            How to order providers: default is newest first; plan_price_sort can
            order by the

            displayed list price (same basis as the UI) for the selected plan and billing type.

             - PROVIDER_PLAN_PRICE_SORT_LEAST_EXPENSIVE_FIRST: Ascending: lowest list price first (usage: hourly, subscription: fixed monthly, free: 0)
             - PROVIDER_PLAN_PRICE_SORT_MOST_EXPENSIVE_FIRST: Descending: highest list price first
          in: query
          required: false
          schema:
            type: string
            enum:
              - PROVIDER_PLAN_PRICE_SORT_UNSPECIFIED
              - PROVIDER_PLAN_PRICE_SORT_LEAST_EXPENSIVE_FIRST
              - PROVIDER_PLAN_PRICE_SORT_MOST_EXPENSIVE_FIRST
            default: PROVIDER_PLAN_PRICE_SORT_UNSPECIFIED
        - name: filterUnlimitedBandwidthOnly
          description: >-
            Only include providers where bandwidth egress is effectively
            unlimited for the selected plan

            (same basis as UI badge: overage_price if > 0 else unit_amount; unlimited when effective $/GB == 0).
          in: query
          required: false
          schema:
            type: boolean
        - name: filterDdosProviders
          description: >-
            When set, only organizations whose ddos_provider is one of these
            slugs are included.

            When empty, do not filter by DDoS. Mirrored by marketplace UI: all slugs "selected" = omit this.
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
      tags:
        - MarketplaceService
