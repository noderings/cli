    v1NodeCPUStatus:
      type: string
      enum:
        - NODE_CPU_STATUS_UNSPECIFIED
        - NODE_CPU_STATUS_AVAILABLE
        - NODE_CPU_STATUS_ALLOCATED_NR
        - NODE_CPU_STATUS_PINNED_FOREIGN
        - NODE_CPU_STATUS_DRIFT
      default: NODE_CPU_STATUS_UNSPECIFIED
      description: >-
        Occupancy status of one host logical CPU (affinity bit).

         - NODE_CPU_STATUS_ALLOCATED_NR: Allocated to a NodeRings VM (vm_id/vm_hostname set).
         - NODE_CPU_STATUS_PINNED_FOREIGN: Pinned by a foreign (non-NodeRings) guest per exporter observation.
         - NODE_CPU_STATUS_DRIFT: DB expectation and exporter observation disagree for this CPU.
